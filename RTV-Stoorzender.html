<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTV Stoorzender - Kijk Live</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #d9d9d9;
        }

        .container {
            max-width: 600px;
            width: 90%;
            margin: 0 auto;
            padding: 40px;
            text-align: left;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .logo-text {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #e9dbb2;
            text-transform: uppercase;
        }

        .logo-img {
            width: 80px;
        }

        .main-title {
            font-family: 'Times New Roman', serif;
            font-size: 3rem;
            color: #555;
            margin-bottom: 10px;
        }

        .divider {
            width: 100%;
            height: 2px;
            background-color: #e9dbb2;
            border: none;
            margin: 20px 0;
        }

        .sub-title {
            font-size: 1.8rem;
            color: #777;
            margin-bottom: 5px;
        }

        .description {
            font-size: 1rem;
            color: #777;
        }

        .footer {
            margin-top: 100px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .footer-text {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }

        .live-button {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 15px 25px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }

        .live-button:hover {
            transform: scale(1.05);
            background-color: #333;
        }

        /* FULLSCREEN VIDEO */
        .video-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo-text">RTV STOORZENDER</div>
        <img src="RTV-Stoorzender-Logo.png" class="logo-img">
    </div>

    <h1 class="main-title">Kijk nu:</h1>
    <hr class="divider">

    <h2 class="sub-title">RTV Stoorzender</h2>
    <p class="description">Alles wat er op het strand gebeurt</p>

    <div class="footer">
        <div class="footer-text">
            KIJK LIVE<br>
            <span style="opacity:0.5; font-weight:bold;">(druk op de knop)</span>
        </div>

        <button class="live-button" onclick="startVideo()">▶ KIJK LIVE</button>
    </div>

</div>

<!-- FULLSCREEN VIDEO -->
<div id="videoContainer" class="video-container">
    <video id="myVideo" loop>
        <source src="stoorzender.mp4" type="video/mp4">
    </video>
</div>

<script>
function startVideo() {
    var container = document.getElementById("videoContainer");
    var video = document.getElementById("myVideo");

    container.style.display = "block";
    video.play();
}
</script>

</body>
</html>
