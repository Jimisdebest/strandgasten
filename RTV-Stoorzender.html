<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTV Stoorzender - Kijk Live</title>
    <style>
        /* Algemene reset en achtergrond */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #d9d9d9; 
            color: #666666;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Container om alles te centreren */
        .container {
            max-width: 600px;
            width: 90%;
            text-align: left;
            position: relative;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Top sectie met logo en titel */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .logo-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #e9dbb2; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-img {
            width: 80px;
            height: auto;
        }

        /* Hoofdtitel "Kijk nu:" */
        .main-title {
            font-family: 'Times New Roman', serif;
            font-size: 3rem;
            color: #555555;
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: normal;
        }

        /* Lijn onder de titel */
        .divider {
            width: 100%;
            height: 2px;
            background-color: #e9dbb2;
            border: none;
            margin: 20px 0;
        }

        /* Subtitel en tekst */
        .sub-title {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 1.8rem;
            color: #777777;
            margin-bottom: 5px;
            font-weight: 300;
        }

        .description {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 1rem;
            color: #777777;
            font-weight: 300;
        }

        /* Footer met tekst en de KNOP */
        .footer {
            margin-top: 100px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .footer-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #888888;
            line-height: 1.4;
            text-transform: uppercase;
        }

        /* De KIJK LIVE knop */
        .live-button {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 15px 25px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .live-button:hover {
            transform: scale(1.05);
            background-color: #333;
        }

        .live-button:active {
            transform: scale(0.95);
        }

        /* Video container - initieel verborgen */
        .video-container {
            display: none;
            margin-top: 30px;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .video-container video {
            width: 100%;
            display: block;
        }

    </style>
</head>
<body>

<div class="container">
    
    <!-- Header met Logo -->
    <div class="header">
        <div class="logo-text">RTV STOORZENDER</div>
        <img src="RTV-Stoorzender-Logo.png" alt="Logo" class="logo-img">
    </div>

    <!-- Hoofd Titel -->
    <h1 class="main-title">Kijk nu:</h1>
    <hr class="divider">

    <!-- Subtitel -->
    <h2 class="sub-title">RTV Stoorzender</h2>
    <p class="description">Alles wat er op het strand gebeurt</p>

    <!-- Footer sectie -->
    <div class="footer">
        <div class="footer-text">
            KIJK LIVE<br>
            <span style="font-weight:bold; opacity:0.5;">(druk op de knop)</span>
        </div>

        <!-- Alleen de KIJK LIVE Knop -->
        <button class="live-button" onclick="startVideo()">▶ KIJK LIVE</button>
    </div>

    <!-- Video container -->
    <div id="videoContainer" class="video-container">
        <video id="myVideo" controls autoplay>
            <source src="stoorzender.mp4" type="video/mp4">
            Stoorzender gedetecteerd... Afbevolen...
        </video>
    </div>

</div>

<script>
    function startVideo() {
        var container = document.getElementById("videoContainer");
        var video = document.getElementById("myVideo");

        // Toon de container
        container.style.display = "block";

        // Probeer video af te spelen
        video.play().catch(function(error) {
            console.log("Autoplay geblokkeerd door browser, klik nogmaals.");
        });

        // Scroll naar de video
        container.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
</script>

</body>
</html>
